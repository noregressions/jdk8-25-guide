# paperband book config for the JDK 8 -> JDK 25 migration guide.
# Book root = this directory; every *.md file here is a card.

title: "The JDK 8 to JDK 25 Migration Guide"

# "classical" is the plainest of the bundled themes (cream paper, serif body,
# hairline rules, no colour gimmicks) - a good match for a straight reference
# guide. Swap for any of: editorial, fieldguide, dark, blueprint, carded, herodevs.
# `pagewright themes` lists them all; --theme on the CLI always overrides this.
theme: classical

vars:
  subtitle: "A practitioner's guide to the largest change in the Java platform's history"
  author: "Steve Poole"
